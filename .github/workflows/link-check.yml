name: 死链检查

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
      - "lychee.toml"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    # 每月 1 号检查一次外链腐烂情况（本领域外链变动频繁）
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  linkcheck:
    name: Markdown 链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行 lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            "**/*.md"
          fail: false
          output: lychee-report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: ignore
