name: 内容勘误
description: 报告教程正文中的错误：论文编号、作者、数字、结论引用有误
title: "[勘误] "
labels: ["勘误"]
body:
  - type: markdown
    attributes:
      value: |
        感谢勘误。**请务必附上出处**（arXiv 编号 + 具体表格/小节），这能省下双方大量核对时间。

  - type: input
    id: location
    attributes:
      label: 出错位置
      description: 章节 + 小节标题，或直接给出文件路径与行号
      placeholder: "第 3 章 3.4 节 / docs/chapter3/第三章 检索增强记忆基础.md:120"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 教程当前的说法
      description: 原文摘录
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: 正确的说法
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 依据来源
      description: |
        论文请给 arXiv 编号与具体位置；厂商文档请给链接与访问日期。
      placeholder: |
        arXiv:2405.14831 Table 2；或
        https://example.com/blog/xxx （访问于 2026-07-30）
    validations:
      required: true
